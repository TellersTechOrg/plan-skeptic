name: plan-skeptic
description: Flag the parts of a Terraform/OpenTofu plan that need a human, as SARIF for code scanning.
branding:
  icon: alert-triangle
  color: orange

inputs:
  plan-json:
    description: Path to `terraform show -json` / `tofu show -json` output of a saved plan.
    required: true
  fail-on:
    description: Lowest severity that fails the step (high, medium, low, never).
    default: high
  sarif-file:
    description: Where to write the SARIF report. Upload it with github/codeql-action/upload-sarif.
    default: plan-skeptic.sarif
  disable:
    description: Space-separated rule ids to skip, e.g. "PS002 PS010".
    default: ""

outputs:
  sarif-file:
    description: Path of the SARIF report.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Run plan-skeptic
      shell: bash
      env:
        PS_PLAN: ${{ inputs.plan-json }}
        PS_FAIL_ON: ${{ inputs.fail-on }}
        PS_SARIF: ${{ inputs.sarif-file }}
        PS_DISABLE: ${{ inputs.disable }}
        PYTHONPATH: ${{ github.action_path }}/src
      run: |
        set -euo pipefail
        args=(--format sarif --output "$PS_SARIF" --fail-on "$PS_FAIL_ON")
        for rule in $PS_DISABLE; do args+=(--disable "$rule"); done
        # Text summary always goes to stdout when SARIF is written to a file;
        # tee it into the job summary so findings are visible without code scanning.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          python3 -m plan_skeptic "${args[@]}" "$PS_PLAN" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          python3 -m plan_skeptic "${args[@]}" "$PS_PLAN"
        fi
