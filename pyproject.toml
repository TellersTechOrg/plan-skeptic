[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plan-skeptic"
version = "0.1.1"
description = "Flag the parts of a Terraform/OpenTofu plan that need a human."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Brian Teller"}]
keywords = ["terraform", "opentofu", "plan", "security", "sarif", "ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/TellersTechOrg/plan-skeptic"

[project.scripts]
plan-skeptic = "plan_skeptic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
